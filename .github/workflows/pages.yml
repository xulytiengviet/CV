name: Build and deploy Long Ngo academic site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.enabled }}
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick rsync
          python -m pip install --upgrade pip nbconvert

      - name: Prepare pinned al-folio source
        run: bash scripts/prepare_site.sh

      - name: Install Ruby and JavaScript dependencies
        working-directory: .build/al-folio
        run: |
          bundle install
          npm ci

      - name: Build Jekyll site
        working-directory: .build/al-folio
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination "$GITHUB_WORKSPACE/_site"

      - name: Configure GitHub Pages
        id: configure_pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Detect Pages readiness
        id: pages_status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.configure_pages.outcome }}" = "success" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is configured; deployment will continue."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Build succeeded, but GitHub Pages is not enabled yet. In Settings > Pages, set Source to GitHub Actions, then re-run this workflow."
          fi

      - name: Upload Pages artifact
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
